<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahim Al Sifat — Social media & AI designer</title>
<meta name="description" content="Fahim Al Sifat designs social media posts, ads and thumbnails, and makes AI videos and AI images for brands.">
<meta name="theme-color" content="#F4F3EE">
<meta property="og:type" content="website">
<meta property="og:title" content="Fahim Al Sifat — Social media & AI designer">
<meta property="og:description" content="Social media design, AI videos and AI images for brands.">
<meta property="og:image" content="assets/img/skincare.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2313261E'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='34' text-anchor='middle' fill='%23F4F3EE'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3EE; --card:#EAE8E0; --ink:#13261E; --muted:#5E6B64; --line:#D5D3CA; --accent:#B8975A;
  --serif:"Playfair Display", Georgia, serif;
  --sans:"Manrope", system-ui, sans-serif;
  --wrap:min(1280px, 100% - 3rem);
  --ease:cubic-bezier(.22,.7,.15,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:var(--wrap);margin-inline:auto}
.skip{position:fixed;left:1rem;top:-60px;z-index:500;background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:999px;font-weight:600;text-decoration:none;transition:top .3s}
.skip:focus{top:1rem}

/* type */
.serif{font-family:var(--serif)}
h2.t{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,4.8vw,4.2rem);line-height:1.02;letter-spacing:-.02em}
h2.t em{font-weight:400}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.6rem;font:600 .92rem var(--sans);padding:.95rem 1.6rem;border-radius:999px;text-decoration:none;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);transition:background .35s var(--ease),color .35s var(--ease)}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn i{font-style:normal;transition:transform .4s var(--ease)}
.btn:hover i{transform:translateX(3px)}
.tlink{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;padding-bottom:2px;transition:background-size .5s var(--ease)}
.tlink:hover{background-size:0 1px;background-position:100% 100%}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:60;transition:background .4s,border-color .4s,transform .5s var(--ease);border-bottom:1px solid transparent}
.nav.solid{background:rgba(244,243,238,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.logo b{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:italic 700 1.05rem var(--serif)}
.logo span{font:italic 600 1.3rem var(--serif)}
.nav ul{display:flex;gap:2.2rem;list-style:none;font-size:.9rem;font-weight:500}
.nav ul a{text-decoration:none;color:var(--muted);transition:color .3s}
.nav ul a:hover{color:var(--ink)}
.nav .btn{padding:.65rem 1.2rem;font-size:.85rem}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;position:relative}
.burger i{position:absolute;left:13px;right:13px;height:1.5px;background:var(--ink);transition:transform .5s var(--ease),top .5s var(--ease)}
.burger i:nth-child(1){top:18px}.burger i:nth-child(2){top:25px}
.menu-open .burger i:nth-child(1){top:21.5px;transform:rotate(45deg)}
.menu-open .burger i:nth-child(2){top:21.5px;transform:rotate(-45deg)}
#menu{position:fixed;inset:0;z-index:55;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:6rem 1.5rem 2rem;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.menu-open #menu{opacity:1;pointer-events:auto}
#menu a.big{font:700 clamp(2.6rem,11vw,3.8rem)/1.15 var(--serif);text-decoration:none;display:block;border-bottom:1px solid var(--line);padding:.3rem 0;transform:translateY(16px);opacity:0;transition:transform .7s var(--ease),opacity .7s var(--ease);transition-delay:calc(var(--i)*50ms + .1s)}
.menu-open #menu a.big{transform:none;opacity:1}
#menu .mfoot{margin-top:2rem;display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;font-size:.92rem;color:var(--muted)}
#menu .mfoot a{text-decoration:none}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:110px 0 2.4rem}
.hero-top{display:grid;grid-template-columns:1fr minmax(260px,30vw);gap:4vw;align-items:start}
.intro{max-width:420px;padding-top:1rem}
.avail{display:inline-flex;align-items:center;gap:.55rem;font-size:.85rem;color:var(--muted);margin-bottom:1.6rem}
.avail i{width:7px;height:7px;border-radius:50%;background:#3E9B6F;box-shadow:0 0 0 0 rgba(62,155,111,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(62,155,111,0)}100%{box-shadow:0 0 0 0 rgba(62,155,111,0)}}
.intro p.l{font-family:var(--serif);font-size:clamp(1.4rem,2.1vw,1.85rem);line-height:1.3}
.intro .actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:2rem}
.feature{position:relative}
.feature{width:min(30vw,calc(min(52vh,560px)*.8));justify-self:end}
.feature .frame{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--card)}
.feature .frame .media{position:absolute;inset:0;opacity:0;transition:opacity 1.2s var(--ease)}
.feature .frame .media.on{opacity:1}
.feature .frame .media img{transform:scale(1.06);transition:transform 6s linear}
.feature .frame .media.on img{transform:scale(1)}
.feature .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:.8rem;font-size:.84rem}
.feature .cap b{font:600 1rem var(--serif)}
.feature .bars{display:flex;gap:4px;margin-top:.7rem}
.feature .bars i{flex:1;height:2px;background:var(--line);overflow:hidden;position:relative}
.feature .bars i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left}
.feature .bars i.done::after{transform:none}
.feature .bars i.on::after{animation:bar 4.2s linear forwards}
@keyframes bar{to{transform:none}}
.masthead{margin-top:4vh;border-top:1px solid var(--ink);padding-top:1.2rem;display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
.masthead h1{font:800 clamp(3.2rem,8.6vw,9.6rem)/.9 var(--serif);letter-spacing:-.035em;white-space:nowrap}
.masthead h1 em{font-weight:400}
.masthead h1 .ln{display:inline-block;overflow:hidden;padding-bottom:.08em;vertical-align:bottom}
.masthead h1 .ln+.ln{margin-left:.22em}
.masthead h1 .ln>span{display:inline-block;transform:translateY(105%);animation:up 1.2s var(--ease) forwards}
.masthead h1 .ln:nth-child(2)>span{animation-delay:.12s}
@keyframes up{to{transform:none}}
.masthead .role{text-align:right;font-size:.92rem;color:var(--muted);max-width:220px;padding-bottom:.6rem}
.masthead .role b{display:block;color:var(--ink);font:italic 600 1.15rem var(--serif)}

/* sections */
section.s{padding:7rem 0;border-top:1px solid var(--line)}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:end;margin-bottom:3.4rem}
.sh p{max-width:44ch;color:var(--muted);justify-self:end}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--rd,0s)}
.rv.in{opacity:1;transform:none}

/* media + post overlay */
.media{position:relative;overflow:hidden;background:var(--card)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:rgba(10,22,17,.28);z-index:1}
.pv{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:space-between;z-index:2;color:#fff}
.pv .tg{font-size:.68rem;font-weight:600;letter-spacing:.02em}
.pv .hl{font:700 clamp(1.4rem,2.3vw,2.2rem)/1.02 var(--serif);text-shadow:0 2px 20px rgba(0,0,0,.25);max-width:14ch}
.pv .pl{align-self:flex-start;padding:.3rem .75rem;border-radius:999px;border:1px solid currentColor;font-size:.66rem;font-weight:600}
.pv.plain{color:var(--ink)}

/* work grid */
.filters{display:flex;gap:1.6rem;flex-wrap:wrap;margin-bottom:2.4rem;font-size:.92rem}
.filters button{background:none;border:0;cursor:pointer;color:var(--muted);padding:.2rem 0;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.filters sup{font-size:.65rem;margin-left:.15rem}
.grid{columns:3;column-gap:1.6rem}
.wk{break-inside:avoid;margin-bottom:2.2rem;display:block;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.wk .media{border-radius:6px}
.wk .media img{transition:transform 1.2s var(--ease)}
.wk:hover .media img{transform:scale(1.04)}
.wk .r-square{aspect-ratio:1}.wk .r-portrait{aspect-ratio:4/5}.wk .r-story{aspect-ratio:4/5}.wk .r-wide{aspect-ratio:4/3}
.wk .cap{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.8rem}
.wk .cap b{font:600 1.08rem var(--serif)}
.wk .cap span{font-size:.82rem;color:var(--muted)}
.wk.hidden{display:none}
.view{position:absolute;right:.8rem;bottom:.8rem;z-index:3;background:var(--paper);color:var(--ink);font-size:.72rem;font-weight:600;padding:.35rem .7rem;border-radius:999px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s var(--ease)}
.wk:hover .view{opacity:1;transform:none}

/* lightbox */
#lb{position:fixed;inset:0;z-index:250;background:var(--paper);display:none;align-items:center;justify-content:center;padding:5rem 2rem 2rem}
#lb.open{display:flex;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0}}
#lb .box{display:grid;grid-template-columns:auto 280px;gap:3rem;align-items:end;max-width:1100px;width:100%}
#lb .media{height:min(76vh,760px);border-radius:6px}
#lb .media .pv .hl{font-size:clamp(2rem,4vw,3.4rem)}
#lb h3{font:700 2.4rem/1.05 var(--serif)}
#lb p{color:var(--muted);margin-top:.5rem}
#lb .bar{position:absolute;top:1.2rem;left:1.5rem;right:1.5rem;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
#lb button.tx{background:none;border:0;cursor:pointer;font:600 .9rem var(--sans);color:var(--ink)}
#lb .nx{display:flex;gap:1.4rem;margin-top:1.8rem}

/* reels */
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem}
.reel .media{aspect-ratio:9/16;border-radius:6px;cursor:pointer}
.reel .media img{animation:kb 14s ease-in-out infinite alternate}
.reel:nth-child(2) .media img{animation-delay:-4s}.reel:nth-child(3) .media img{animation-delay:-8s}.reel:nth-child(4) .media img{animation-delay:-11s}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.18) translate(-2%,-2%)}}
.reel .media.paused img,.reel .media.paused .pb i{animation-play-state:paused}
.reel .pb{position:absolute;left:.8rem;right:.8rem;bottom:.8rem;height:2px;background:rgba(255,255,255,.35);z-index:2}
.reel .pb i{display:block;height:100%;width:0;background:#fff;animation:prog 14s linear infinite}
@keyframes prog{to{width:100%}}
.reel .st{position:absolute;top:.8rem;left:.8rem;z-index:2;background:rgba(255,255,255,.9);color:var(--ink);font-size:.68rem;font-weight:600;padding:.25rem .6rem;border-radius:999px}
.reel .cap{margin-top:.8rem}
.reel .cap b{font:600 1.05rem var(--serif);display:block}
.reel .cap span{font-size:.84rem;color:var(--muted)}

/* AI */
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.ai-grid .media{aspect-ratio:1;border-radius:6px}
.ai-grid figure:nth-child(2){margin-top:3rem}.ai-grid figure:nth-child(5){margin-top:3rem}
.ai-grid figcaption{font-size:.82rem;color:var(--muted);margin-top:.6rem}
.ai-grid .media img{transition:transform 1.2s var(--ease)}
.ai-grid figure:hover .media img{transform:scale(1.05)}
.cmp-row{display:grid;grid-template-columns:.75fr 1.25fr;gap:4rem;align-items:center;margin-top:6rem}
.cmp-row h3{font:700 clamp(1.8rem,3vw,2.6rem)/1.08 var(--serif)}
.cmp-row p{color:var(--muted);margin-top:1rem;max-width:40ch}
.cmp{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:4/3;--p:50%;user-select:none;background:var(--card)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .before img{filter:grayscale(.9) brightness(.85) contrast(.85)}
.cmp .after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p))}
.cmp .after img{filter:saturate(1.12) contrast(1.04)}
.cmp .after .pv .hl{font-size:clamp(1.8rem,3.4vw,3rem)}
.cmp .lbl{position:absolute;top:1rem;z-index:3;font-size:.72rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;background:var(--paper);color:var(--ink)}
.cmp .lbl.l{left:1rem}.cmp .lbl.r{right:1rem}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--p);width:1px;background:#fff;z-index:4;pointer-events:none}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.cmp .handle::before{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;font-size:.95rem;font-weight:700;color:var(--ink);letter-spacing:.1em;white-space:nowrap}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:5;margin:0}
.tools{margin-top:5rem;display:flex;flex-wrap:wrap;gap:.6rem 2.2rem;font:italic 500 clamp(1.2rem,2vw,1.6rem) var(--serif);color:var(--muted)}
.tools span{transition:color .3s}
.tools span:hover{color:var(--ink)}

/* services */
.svc{list-style:none;border-top:1px solid var(--ink)}
.svc li{display:grid;grid-template-columns:1.1fr 1.5fr auto;gap:2rem;padding:1.6rem 0;border-bottom:1px solid var(--line);align-items:baseline;transition:padding .5s var(--ease)}
.svc li:hover{padding-left:.8rem}
.svc h3{font:600 clamp(1.4rem,2.2vw,1.9rem)/1.1 var(--serif)}
.svc p{color:var(--muted);max-width:52ch}
.svc .price{font-weight:600;white-space:nowrap}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:5rem;align-items:start}
.about .media{aspect-ratio:4/5;border-radius:6px}
.about blockquote{font:500 clamp(1.7rem,2.8vw,2.5rem)/1.2 var(--serif)}
.about blockquote em{font-weight:400}
.about .txt{margin-top:1.8rem;color:var(--muted);max-width:56ch;display:grid;gap:1rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:3rem;border-top:1px solid var(--line)}
.facts div{padding:1.3rem 1rem 0 0}
.facts b{display:block;font:700 2.6rem/1 var(--serif)}
.facts span{font-size:.84rem;color:var(--muted)}

/* contact */
.contact{padding:8rem 0 6rem;border-top:1px solid var(--line)}
.contact h2{font:800 clamp(3rem,8vw,7.5rem)/.95 var(--serif);letter-spacing:-.03em;max-width:12ch}
.contact h2 em{font-weight:400}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;margin-top:4rem}
.c-mail{font:600 clamp(1.4rem,2.4vw,2rem) var(--serif)}
.c-info{margin-top:2rem;display:grid;gap:.5rem;color:var(--muted);font-size:.95rem}
.c-info a{text-decoration:none}.c-info a:hover{color:var(--ink)}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem 1.4rem}
.cform label{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted)}
.cform .full{grid-column:1/-1}
.cform input,.cform textarea,.cform select{font:500 1rem var(--sans);padding:.7rem 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;transition:border-color .3s}
.cform input:focus,.cform textarea:focus,.cform select:focus{outline:none;border-color:var(--ink)}
.cform textarea{resize:vertical}
.cform .btn{justify-self:start;margin-top:.6rem}
.note-s{grid-column:1/-1;font-size:.9rem;min-height:1.4em;color:var(--ink)}
footer{border-top:1px solid var(--line);padding:2rem 0}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
#btt{position:fixed;right:1.3rem;bottom:1.3rem;z-index:58;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .5s var(--ease)}
#btt.on{opacity:1;transform:none}
#site img{opacity:0;transition:opacity .8s var(--ease),transform 1.2s var(--ease)}
#site img.ld{opacity:1}

/* ================= ADMIN ================= */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:200;background:#F7F8F4;color:var(--ink);box-shadow:-30px 0 60px -20px rgba(0,0,0,.35);display:none;flex-direction:column;font-size:.9rem;transform:translateX(100%);transition:transform .5s var(--ease)}
#admin.open{display:flex}
#admin.shown{transform:none}
.ad-top{padding:1rem 1.2rem;border-bottom:1px solid #DDE3D8;display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--ink);color:var(--ivory)}
.ad-top b{font-family:var(--serif);font-size:1.6rem;font-weight:700;font-style:normal;font-optical-sizing:auto}
.ad-top .x{background:none;border:1px solid rgba(242,240,230,.4);color:inherit;border-radius:999px;padding:.4rem .9rem;cursor:pointer;font:500 .8rem var(--sans)}
.ad-tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.8rem 1.2rem;border-bottom:1px solid #DDE3D8;scrollbar-width:none}
.ad-tabs button{flex:none;font:500 .8rem var(--sans);padding:.45rem .9rem;border-radius:999px;border:1px solid #CBD4C6;background:#fff;cursor:pointer;color:var(--ink)}
.ad-tabs button[aria-selected="true"]{background:var(--pine);color:var(--ivory);border-color:var(--pine)}
.ad-body{flex:1;overflow-y:auto;padding:1.2rem}
.ad-body h4{font-family:var(--serif);font-size:1.5rem;margin:0 0 .8rem;font-weight:700;font-style:normal;font-optical-sizing:auto}
.fld{display:grid;gap:.3rem;margin-bottom:.9rem}
.fld>span{font-size:.75rem;font-weight:600;opacity:.75}
.fld input[type=text],.fld textarea,.fld select{font:400 .9rem var(--sans);padding:.6rem .75rem;border:1px solid #CBD4C6;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld input[type=color]{width:56px;height:34px;border:1px solid #CBD4C6;border-radius:8px;background:#fff;padding:2px}
.fld.chk{display:flex;align-items:center;gap:.6rem}
.grp{border:1px solid #DDE3D8;border-radius:12px;padding:.9rem;margin-bottom:.9rem;background:#fff}
.grp>.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:.4rem}
.grp>.gh b{font-size:.82rem}
.mini{font:500 .72rem var(--sans);padding:.3rem .6rem;border:1px solid #CBD4C6;border-radius:6px;background:#fff;cursor:pointer;color:var(--ink)}
.mini.del{color:#9B2C2C;border-color:#E6C4C4}
.add{width:100%;font:600 .8rem var(--sans);padding:.65rem;border:1px dashed var(--pine);border-radius:10px;background:transparent;color:var(--pine);cursor:pointer;margin-bottom:1rem}
.imgf{display:flex;gap:.6rem;align-items:center}
.imgf .thumbp{width:58px;height:58px;border-radius:8px;background:#E6EBE2 center/cover no-repeat;border:1px solid #CBD4C6;flex:none}
.imgf label.up{font:500 .78rem var(--sans);padding:.45rem .8rem;border:1px solid #CBD4C6;border-radius:8px;cursor:pointer;background:#fff}
.imgf input[type=file]{display:none}
.ad-foot{border-top:1px solid #DDE3D8;padding:.9rem 1.2rem;display:grid;gap:.6rem;background:#fff}
.ad-foot .r{display:flex;gap:.5rem;flex-wrap:wrap}
.ad-foot button{font:600 .8rem var(--sans);padding:.65rem 1rem;border-radius:999px;border:1px solid var(--pine);background:#fff;color:var(--pine);cursor:pointer}
.ad-foot button.pri{background:var(--pine);color:var(--ivory)}
.ad-status{font-size:.78rem;min-height:1.2em;color:var(--pine)}
.help{font-size:.8rem;opacity:.75;margin-bottom:1rem;line-height:1.5}
.ad-gate{padding:2rem 1.4rem;display:grid;gap:1rem}
textarea.json{font-family:ui-monospace,monospace;font-size:.75rem;min-height:220px}




/* photo posts */
.scrim{position:absolute;inset:0;background:rgba(8,24,18,.34);z-index:1}
.pv.on-img{color:#fff;z-index:2}
.pv.on-img .hl{text-shadow:0 2px 24px rgba(0,0,0,.35)}
.tile .pv.on-img b{color:#fff}
.slides .media{position:relative;overflow:hidden}
.fp .pv .hl{font-size:1.45rem}
.fp .pv{padding:8%}
.wk .media img{transform:scale(1.12);transition:none;will-change:transform}
.wk:hover .media img{transform:scale(1.12)}
.player>img{transition:transform 8s ease-out}
.player.playing>img{transform:scale(1.18)}
.wk .media{clip-path:inset(0 0 0 0 round 20px)}




@media (max-width:980px){
  :root{--wrap:min(1280px, 100% - 2.5rem)}
  .nav ul,.nav .btn{display:none}
  .burger{display:block}
  .hero{padding-top:92px}
  .hero-top,.sh,.cmp-row,.about,.c-grid{grid-template-columns:1fr}
  .hero-top{gap:2rem}
  .hero{justify-content:flex-start;gap:2rem}
  .masthead{order:-1;margin:0;border-top:0;padding-top:.5rem}
  .feature{width:100%}
  .masthead h1{white-space:normal;font-size:clamp(3.4rem,17vw,6rem)}
  .masthead h1 .ln{display:block}.masthead h1 .ln+.ln{margin-left:0}
  .sh{gap:1rem}.sh p{justify-self:start}
  section.s{padding:5rem 0}
  .grid{columns:2;column-gap:1rem}
  .reels{grid-template-columns:repeat(2,1fr);gap:1rem}
  .ai-grid{grid-template-columns:repeat(2,1fr)}
  .ai-grid figure:nth-child(2),.ai-grid figure:nth-child(5){margin-top:0}
  .ai-grid figure:nth-child(even){margin-top:2rem}
  .svc li{grid-template-columns:1fr;gap:.4rem}
  .about{gap:2.5rem}.about .media{max-width:420px}
  .masthead{flex-direction:column;align-items:flex-start;gap:.8rem}
  .masthead .role{text-align:left}
  #lb .box{grid-template-columns:1fr;gap:1.2rem}
  #lb .media{height:58vh}
  .cmp{aspect-ratio:4/5}
  .c-grid{gap:3rem}
}
@media (max-width:560px){.grid{columns:1}.cform{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.masthead h1 .ln>span{transform:none}html{scroll-behavior:auto}}

const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function merge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)?over:base;
  if(base&&typeof base==="object"){const o={};for(const k in base)o[k]=merge(base[k],over?.[k]);
    if(over&&typeof over==="object")for(const k in over)if(!(k in o))o[k]=over[k];return o;}
  return over===undefined?base:over;
}
const LS={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}},del(k){try{localStorage.removeItem(k)}catch{}}};

function art(w){

}

  $("#site").innerHTML=`
<nav class="nav" aria-label="Main"><div class="wrap">

/* behaviour */
const st={};let io,featT;
function setup(){
  // filters
  const fb=$$(".filters button");
  fb.forEach(b=>b.onclick=()=>{fb.forEach(x=>x.setAttribute("aria-pressed",x===b));const f=b.dataset.f;$$(".wk").forEach(w=>w.classList.toggle("hidden",f!=="*"&&w.dataset.c!==f))});
  $$(".wk").forEach(w=>w.onclick=()=>openLB(+w.dataset.i));
  // reels pause
  $$(".reel .media").forEach(m=>{const t=()=>m.classList.toggle("paused");m.onclick=t;m.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}}});
  // featured rotator
  clearInterval(featT);
  const fr=$("#feat");if(fr&&!RM){const items=$$(".media",fr),bars=$$(".feature .bars i"),feat=C.work.items.filter(w=>w.image).slice(0,5);let k=0;
    featT=setInterval(()=>{items[k].classList.remove("on");bars[k].classList.remove("on");bars[k].classList.add("done");k=(k+1)%items.length;
      if(k===0)bars.forEach(x=>x.classList.remove("done"));items[k].classList.add("on");void bars[k].offsetWidth;bars[k].classList.add("on");
      $("#featC").textContent=feat[k].client;$("#featT").textContent=feat[k].caption},4200)}
  // compare
  const cmp=$("#cmp");if(cmp){const r=$("input",cmp);r.oninput=()=>cmp.style.setProperty("--p",r.value+"%")}
  // menu
  const bg=$("#burger");if(bg){bg.onclick=()=>setMenu(!document.body.classList.contains("menu-open"));$$("#menu a.big").forEach(a=>a.addEventListener("click",()=>setMenu(false)))}
  // image fade
  $$("#site img").forEach(i=>{const on=()=>i.classList.add("ld");if(i.complete&&i.naturalWidth)on();else{i.addEventListener("load",on,{once:true});i.addEventListener("error",on,{once:true})}});
  // reveal
  io?.disconnect();const els=$$(".rv");
  if(!firstRender||RM||!("IntersectionObserver" in window))els.forEach(e=>e.classList.add("in"));
  else{io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");if(e.target.classList.contains("facts"))countUp(e.target);io.unobserve(e.target)}}),{threshold:.1});els.forEach(e=>io.observe(e))}
  // form
  const f=$("#cf");
  if(f)f.onsubmit=async e=>{e.preventDefault();const note=$("#note");
    if(!f.name.value.trim()||!f.email.checkValidity()){note.textContent="Add your name and a valid email to send.";return}
    const ep=C.contact.formEndpoint.trim();
    if(!ep){note.textContent="The form isn't connected yet. Please email "+C.brand.email+".";return}
    note.textContent="Sending…";

    catch{note.textContent="The message couldn't be sent. Please email "+C.brand.email+"."}};
}

const TABS=[["theme","Colors"],["sections","Sections"],["brand","Brand"],["hero","Hero"],["work","Work"],["reels","Reels"],["ai","AI images"],["services","Services"],["about","About"],["contact","Contact"],["footer","Footer"],["_publish","Publish"]];

/* ---------- live sync (Claude artifact db) ---------- */
const LIVE={db:null,ref:null,assets:null,owner:false,ready:false,last:"",writing:false,queued:false};
function stripData(o){return JSON.parse(JSON.stringify(o,(k,v)=>typeof v==="string"&&v.startsWith("data:")?"":v))}
async function liveInit(){
  if(!window.claude?.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db)return;
    LIVE.db=db;LIVE.owner=!!(await user?.isOwner?.());
    if(LIVE.owner)LIVE.assets=await claude.use("assets");
    LIVE.ref=db.doc("site/content");
    LIVE.ref.onSnapshot(snap=>{
      LIVE.ready=true;
      if(!snap.exists)return;
      const json=JSON.stringify(snap.data().content||{});
      if(json===LIVE.last)return;LIVE.last=json;
      if(snap.metadata.hasPendingWrites)return;
      try{const next=merge(DEFAULT,JSON.parse(json));if(JSON.stringify(next)===JSON.stringify(C))return;C=next;const y=scrollY;render();scrollTo(0,y);if($("#admin").classList.contains("open"))drawTab()}catch{}
    },()=>{});
    updateLiveBadge();
  }catch{}
}
function updateLiveBadge(){const s=$("#adStatus");if(!s)return;s.textContent=LIVE.owner?"Live: changes save for everyone who opens this link.":"Changes save as a draft in this browser."}
async function liveSave(){
  if(!LIVE.ref||!LIVE.owner)return false;
  if(LIVE.writing){LIVE.queued=true;return true}
  LIVE.writing=true;
  try{const clean=stripData(C);const json=JSON.stringify(clean);
    if(json!==LIVE.last){LIVE.last=json;await LIVE.ref.set({content:clean,updatedAt:new Date().toISOString()})}
    status("Saved live. Everyone with the link sees this now.")}
  catch(e){status(e?.code==="quota_exceeded"?"Live storage is full. Remove some images.":"Couldn't save live right now. Your draft is kept in this browser.")}
  LIVE.writing=false;if(LIVE.queued){LIVE.queued=false;liveSave()}
  return true;
}
let liveT;
function changed(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{const y=scrollY;render();scrollTo(0,y);
    const ok=LS.set(DRAFT_KEY,JSON.stringify(C));
    if(LIVE.owner&&LIVE.ref){status("Saving live…");clearTimeout(liveT);liveT=setTimeout(liveSave,900)}
    else status(ok?"Draft saved in this browser. Publish to make it live.":"Draft is too large for browser storage (big images). Publish to GitHub to keep it.")},180);
}
const getAt=(path)=>path.reduce((o,k)=>o[k],C);
function setAt(path,val){const o=getAt(path.slice(0,-1));o[path.at(-1)]=val;changed()}

function drawTab(){
  const body=$("#adBody");
  if(tab==="_publish")return drawPublish(body);
  body.innerHTML=`<h4>${TABS.find(t=>t[0]===tab)[1]}</h4>`+helpFor(tab);
  body.appendChild(field([tab],C[tab],tab));
}
function helpFor(t){
  const h={theme:"Site colors. Keep it to these few for a clean look.",sections:"Turn whole sections on or off.",hero:"The image on the right rotates through your first five Work images.",work:"Your designs. Upload an image; untick Text On Image if the design already has its own text.",reels:"Each reel shows an image with a slow cinematic zoom.",ai:"Gallery and Captions go in the same order. The compare slider shows one image before and after.",contact:"To receive messages, create a free form at formspree.io and paste its endpoint URL here."};
  return h[t]?`<p class="help">${h[t]}</p>`:"";
}
function blankLike(x){if(typeof x==="string")return"";if(typeof x==="boolean")return x;if(Array.isArray(x))return[];const o={};for(const k in x)o[k]=k==="format"?x[k]:k==="tone"?x[k]:blankLike(x[k]);return o}

function field(path,val,key){
  const k=String(key);
  const wrap=document.createElement("div");
  if(Array.isArray(val)){
    const isImgList=k==="gallery"||k==="images";
    val.forEach((item,i)=>{
      const g=document.createElement("div");g.className="grp";
      const label=typeof item==="object"?(item.client||item.name||item.title||item.label||item.handle||item.value||`Item ${i+1}`):`${human(k).replace(/s$/,"")} ${i+1}`;
      g.innerHTML=`<div class="gh"><b>${esc(label)}</b><span style="display:flex;gap:.3rem"><button class="mini" data-a="up">↑</button><button class="mini" data-a="down">↓</button><button class="mini del" data-a="del">Remove</button></span></div>`;
      g.querySelector('[data-a=up]').onclick=()=>{if(i>0){[val[i-1],val[i]]=[val[i],val[i-1]];changed();drawTab()}};
      g.querySelector('[data-a=down]').onclick=()=>{if(i<val.length-1){[val[i+1],val[i]]=[val[i],val[i+1]];changed();drawTab()}};
      g.querySelector('[data-a=del]').onclick=()=>{val.splice(i,1);changed();drawTab()};
      if(typeof item==="object")g.appendChild(field([...path,i],item,i));
      else g.appendChild(isImgList?imgField([...path,i],item,"Image"):textField([...path,i],item,"Text",false));
      wrap.appendChild(g);
    });
    const add=document.createElement("button");add.className="add";add.textContent="+ Add "+human(k).replace(/s$/,"").toLowerCase();
    add.onclick=()=>{val.push(val.length?blankLike(val[0]):"");changed();drawTab()};
    wrap.appendChild(add);return wrap;
  }
  if(val&&typeof val==="object"){
    for(const kk in val){
      const v=val[kk],p=[...path,kk];
      if(Array.isArray(v)){const g=document.createElement("div");g.innerHTML=`<div class="fld"><span>${human(kk)}</span></div>`;g.appendChild(field(p,v,kk));wrap.appendChild(g)}
      else if(v&&typeof v==="object"){const g=document.createElement("div");g.className="grp";g.innerHTML=`<div class="gh"><b>${human(kk)}</b></div>`;g.appendChild(field(p,v,kk));wrap.appendChild(g)}
      else if(typeof v==="boolean"){const l=document.createElement("label");l.className="fld chk";l.innerHTML=`<input type="checkbox" ${v?"checked":""}><span>${human(kk).replace(/^Show /,"Show ")}</span>`;l.firstChild.onchange=e=>setAt(p,e.target.checked);wrap.appendChild(l)}
      else if(path[0]==="theme"){const l=document.createElement("label");l.className="fld";l.innerHTML=`<span>${human(kk)}</span><span style="display:flex;gap:.5rem;align-items:center"><input type="color" value="${esc(v)}"><input type="text" value="${esc(v)}" style="max-width:120px"></span>`;
        const [c,t]=l.querySelectorAll("input");c.oninput=e=>{t.value=e.target.value;setAt(p,e.target.value)};t.oninput=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value)){c.value=e.target.value;setAt(p,e.target.value)}};wrap.appendChild(l)}
      else if(SELECTS[kk]){const l=document.createElement("label");l.className="fld";l.innerHTML=`<span>${human(kk)}</span><select>${SELECTS[kk].map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;l.querySelector("select").onchange=e=>setAt(p,e.target.value);wrap.appendChild(l)}
      else if(IMG.test(kk))wrap.appendChild(imgField(p,v,human(kk)));
      else wrap.appendChild(textField(p,v,human(kk),LONG.test(kk)||String(v).length>70));
    }
  }
  return wrap;
}
function textField(p,v,label,long){
  const l=document.createElement("label");l.className="fld";
  l.innerHTML=`<span>${esc(label)}</span>${long?`<textarea>${esc(v)}</textarea>`:`<input type="text" value="${esc(v)}">`}`;
  l.querySelector("input,textarea").oninput=e=>setAt(p,e.target.value);return l;
}
function imgField(p,v,label){
  const d=document.createElement("div");d.className="fld";
  d.innerHTML=`<span>${esc(label)}</span><div class="imgf"><div class="thumbp"></div><label class="up">Upload<input type="file" accept="image/*"></label><button class="mini del" type="button">Clear</button></div><input type="text" placeholder="or paste image path / URL" value="${v&&!v.startsWith("data:")?esc(v):""}">`;
  const th=d.querySelector(".thumbp");const show=x=>th.style.backgroundImage=x?`url("${x.replace(/"/g,'%22')}")`:"none";show(v);
  d.querySelector("input[type=file]").onchange=async e=>{const f=e.target.files[0];if(!f)return;status("Optimizing image…");let url=await compress(f);
    if(LIVE.assets){try{status("Uploading image…");const blob=await new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);c.toBlob(r,"image/jpeg",.86)};im.src=url});const up=await LIVE.assets.upload(blob);url=up.url||("/_blob/"+up.id)}catch{status("Image upload failed. It's kept in this browser only.")}}
    show(url);setAt(p,url)};
  d.querySelector(".mini").onclick=()=>{show("");d.querySelector("input[type=text]").value="";setAt(p,"")};
  d.querySelector("input[type=text]").oninput=e=>{show(e.target.value);setAt(p,e.target.value)};
  return d;
}
function compress(file,max=1600){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- publish ---------- */
function drawPublish(body){
  let g={};try{g=JSON.parse(LS.get(GH_KEY)||"{}")}catch{}
  body.innerHTML=`<h4>Publish</h4>
  <p class="help">Publishing saves your changes to <b>content.json</b> in your GitHub repo, and uploads new images to <b>assets/uploads/</b>. GitHub Pages updates the live site about a minute later.<br><br>
  You need a GitHub <b>fine-grained personal access token</b> with access only to this repo and <b>Contents: Read and write</b> permission (GitHub → Settings → Developer settings → Personal access tokens). The token is stored only in this browser.</p>
  <label class="fld"><span>GitHub username</span><input type="text" id="gO" value="${esc(g.owner||"fahim-alsifat")}"></label>
  <label class="fld"><span>Repository</span><input type="text" id="gR" value="${esc(g.repo||"my-portfolio")}"></label>
  <label class="fld"><span>Branch</span><input type="text" id="gB" value="${esc(g.branch||"main")}"></label>
  <label class="fld"><span>Access token</span><input type="text" id="gT" value="${esc(g.token||"")}" autocomplete="off" style="-webkit-text-security:disc"></label>
  <div class="r" style="display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1.4rem"><button class="mini" id="gGo" style="background:var(--pine);color:var(--ivory);padding:.6rem 1rem">Publish now</button><button class="mini" id="gForget" style="padding:.6rem 1rem">Forget token</button></div>
  <h4>Backup</h4>
  <p class="help">Copy all content as JSON to keep a backup, or paste JSON here and import it.</p>
  <label class="fld"><textarea class="json" id="gJ"></textarea></label>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="mini" id="gCopy" style="padding:.6rem 1rem">Copy content JSON</button><button class="mini" id="gImp" style="padding:.6rem 1rem">Import pasted JSON</button></div>`;
  const save=()=>LS.set(GH_KEY,JSON.stringify({owner:$("#gO").value.trim(),repo:$("#gR").value.trim(),branch:$("#gB").value.trim(),token:$("#gT").value.trim()}));
  ["gO","gR","gB","gT"].forEach(id=>$("#"+id).oninput=save);
  $("#gForget").onclick=()=>{$("#gT").value="";save();status("Token removed from this browser.")};
  $("#gGo").onclick=()=>{save();publish()};
  $("#gCopy").onclick=async()=>{const j=JSON.stringify(C,null,2);$("#gJ").value=j;try{await navigator.clipboard.writeText(j);status("Content JSON copied.")}catch{status("Select the text above and copy it.")}};
  $("#gImp").onclick=()=>{try{C=merge(DEFAULT,JSON.parse($("#gJ").value));changed();status("Imported.");}catch{status("That isn't valid JSON. Check what you pasted.")}};
}
const b64=s=>{const bytes=new TextEncoder().encode(s);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)};
async function publish(){
  const g=JSON.parse(LS.get(GH_KEY)||"{}");
  if(!g.owner||!g.repo||!g.token){status("Add your username, repository and token first.");return}
  const api=(path,opt={})=>fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`,{...opt,headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
  try{
    // 1. upload embedded images
    const data=clone(C);let n=0;const jobs=[];
    (function walk(o){for(const k in o){const v=o[k];if(typeof v==="string"&&v.startsWith("data:image/"))jobs.push([o,k,v]);else if(v&&typeof v==="object")walk(v)}})(data);
    for(const [o,k,v] of jobs){n++;status(`Uploading image ${n} of ${jobs.length}…`);
      const path=`assets/uploads/${Date.now()}-${n}.jpg`;
      const r=await api(path,{method:"PUT",body:JSON.stringify({message:`Upload ${path}`,content:v.split(",")[1],branch:g.branch||"main"})});
      if(!r.ok)throw new Error(`Image upload failed (${r.status})`);o[k]=path}
    // 2. write content.json
    status("Saving content…");
    let sha;const cur=await api(`content.json?ref=${encodeURIComponent(g.branch||"main")}`);if(cur.ok)sha=(await cur.json()).sha;
    const r=await api("content.json",{method:"PUT",body:JSON.stringify({message:"Update site content from admin",content:b64(JSON.stringify(data,null,2)),branch:g.branch||"main",sha})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error((e.message||"Save failed")+` (${r.status})`)}
    C=data;LS.set(DRAFT_KEY,JSON.stringify(C));
    status("Published. The live site updates in about a minute.");
  }catch(e){status(e.message==="Failed to fetch"?"Can't reach GitHub from here. Open the admin on your live site to publish.":"Publish stopped: "+e.message+". Check the token's repo access and permissions.")}
}
