<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahim Al Sifat — Social media & AI designer</title>
<meta name="description" content="Fahim Al Sifat designs social media posts, ads and thumbnails, and makes AI videos and AI images for brands.">
<meta name="theme-color" content="#1E4D3A">
<meta property="og:type" content="website">
<meta property="og:title" content="Fahim Al Sifat — Social media & AI designer">
<meta property="og:description" content="Social media design, AI videos and AI images for brands.">
<meta property="og:image" content="assets/img/skincare.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3A'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='38' text-anchor='middle' fill='%23F6F1E7'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E7; --board:#1E4D3A; --pine:#163A2C; --ink:#12261D; --gold:#C6AB6E; --sage:#A9BBA3; --ivory:#FBF8F1; --selection:#2F7BF6;
  --butter:#F9E27D; --rose:#F5B8D0; --sky:#A8D5F7; --mint:#BFE8D2;
  --serif:"Playfair Display", Georgia, serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
  --sans:"Manrope", system-ui, sans-serif;
  --wrap:min(1220px, 100% - 2.5rem);
  --ease:cubic-bezier(.2,.75,.15,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--selection);outline-offset:3px;border-radius:6px}
.wrap{width:var(--wrap);margin-inline:auto}
.skip{position:fixed;left:1rem;top:-60px;z-index:500;background:var(--butter);color:var(--ink);padding:.7rem 1.1rem;border-radius:999px;font-weight:700;text-decoration:none;transition:top .3s}
.skip:focus{top:1rem}
#bar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0);z-index:70}

/* grid paper */
.grid-bg{background-image:linear-gradient(rgba(18,38,29,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,38,29,.06) 1px,transparent 1px);background-size:48px 48px}

/* ---------- type ---------- */
.mix{font-family:var(--serif);font-weight:800;font-size:clamp(2.8rem,6.4vw,5.6rem);line-height:.98;letter-spacing:-.02em}
.mix em{font-weight:400;font-style:italic;letter-spacing:-.01em}
.lede{font-size:1.08rem;max-width:46ch;opacity:.82}
.hand{font-family:var(--hand)}
.mark{display:inline-block;padding:.12em .55em;border-radius:4px;font-size:.78rem;font-weight:700;color:var(--ink)}
.mk-butter{background:var(--butter)}.mk-mint{background:var(--mint)}.mk-rose{background:var(--rose)}.mk-sky{background:var(--sky)}

/* selection box (Figma / text-select handles) */
.sel{position:relative;display:inline-block;padding:0 .14em;z-index:0}
.sel::before{content:"";position:absolute;inset:.04em -.04em -.02em;z-index:-1;background:color-mix(in srgb,var(--selection) 16%,transparent);outline:1.5px solid var(--selection);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease) .15s}
.sel .ca{position:absolute;top:.02em;bottom:-.04em;width:3px;background:var(--selection);opacity:0;transition:opacity .3s .9s}
.sel .ca::after{content:"";position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--selection)}
.sel .ca.l{left:-.06em}.sel .ca.l::after{top:-10px}
.sel .ca.r{right:-.06em}.sel .ca.r::after{bottom:-10px}
.in .sel::before,.sel.in::before{transform:none}
.in .sel .ca,.sel.in .ca{opacity:1}

/* ---------- buttons: blurred mesh pills ---------- */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:.7rem;font:700 .95rem var(--sans);padding:1rem 1.6rem 1rem 1.8rem;border-radius:999px;text-decoration:none;cursor:pointer;color:var(--ink);background:#E8F3EC;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 10px 30px -12px rgba(0,0,0,.35);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.btn::before{content:"";position:absolute;inset:-60% -30%;z-index:-1;filter:blur(16px);
  background:radial-gradient(circle at 18% 55%,#7FD6B4 0 16%,transparent 36%),radial-gradient(circle at 78% 35%,#F2C9A6 0 14%,transparent 34%),radial-gradient(circle at 50% 105%,#FFFFFF 0 22%,transparent 46%),radial-gradient(circle at 62% 0%,#A9C8FF 0 14%,transparent 38%);
  animation:mesh 7s ease-in-out infinite alternate}
@keyframes mesh{to{transform:translate(9%,-7%) rotate(14deg) scale(1.08)}}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px -14px rgba(0,0,0,.45)}
.btn svg{width:18px;height:18px;flex:none;transition:transform .5s var(--ease)}
.btn:hover svg{transform:translate(3px,-3px) rotate(-8deg)}
.btn.dark{color:#fff;background:linear-gradient(#0F1A15,#0F1A15) padding-box,linear-gradient(100deg,#8FE3C7,#E9D27F 45%,#F2A7C3) border-box;border:1.5px solid transparent}
.btn.dark::before{opacity:.55;background:radial-gradient(circle at 15% 60%,#2F6B52 0 18%,transparent 40%),radial-gradient(circle at 70% 30%,#7A4E3A 0 16%,transparent 38%),radial-gradient(circle at 92% 80%,#3A3460 0 14%,transparent 36%)}
.btn.sky{background:#D9ECFF}
.btn.sky::before{background:radial-gradient(circle at 12% 50%,#2F7BF6 0 18%,transparent 40%),radial-gradient(circle at 80% 30%,#EBDCCF 0 16%,transparent 40%),radial-gradient(circle at 55% 110%,#FFFFFF 0 22%,transparent 46%)}

/* ---------- nav ---------- */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:1.8rem;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(18,38,29,.08);border-radius:999px;padding:.4rem .45rem .4rem 1.2rem;box-shadow:0 12px 34px -16px rgba(0,0,0,.4);width:max-content;max-width:calc(100% - 1.5rem)}
.logo{font-family:var(--serif);font-style:italic;font-weight:700;font-size:1.35rem;text-decoration:none;line-height:1}
.nav ul{display:flex;gap:1.5rem;list-style:none;font-size:.86rem;font-weight:600}
.nav ul a{text-decoration:none;opacity:.7;transition:opacity .3s}
.nav ul a:hover{opacity:1}
.nav .cta{background:var(--ink);color:var(--ivory);text-decoration:none;font-size:.82rem;font-weight:700;border-radius:999px;padding:.6rem 1.1rem}
.burger{display:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;position:relative}
.burger i{position:absolute;left:12px;right:12px;height:1.5px;background:#fff;transition:transform .5s var(--ease),top .5s var(--ease)}
.burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:23px}
.menu-open .burger i:nth-child(1){top:19.5px;transform:rotate(45deg)}
.menu-open .burger i:nth-child(2){top:19.5px;transform:rotate(-45deg)}
#menu{position:fixed;inset:0;z-index:55;background:var(--board);color:var(--ivory);display:flex;flex-direction:column;justify-content:center;padding:6rem 1.6rem 2rem;clip-path:circle(0% at 50% 2.4rem);transition:clip-path .8s var(--ease);pointer-events:none}
.menu-open #menu{clip-path:circle(150% at 50% 2.4rem);pointer-events:auto}
#menu a.big{font-family:var(--serif);font-weight:800;font-size:clamp(2.6rem,11vw,4rem);line-height:1.1;text-decoration:none;display:block;overflow:hidden}
#menu a.big:nth-child(even){font-style:italic;font-weight:400}
#menu a.big span{display:inline-block;transform:translateY(110%);transition:transform .8s var(--ease);transition-delay:calc(var(--i)*60ms + .15s)}
.menu-open #menu a.big span{transform:none}
#menu .mfoot{margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:1rem 1.6rem;font-size:.9rem;opacity:0;transition:opacity .6s .5s}
.menu-open #menu .mfoot{opacity:.8}
#menu .mfoot a{text-decoration:none}

/* ---------- hero board ---------- */
.board{background:var(--board);color:var(--ivory)}
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column}
.cal{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:150px;pointer-events:none}
.cal i{border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);font:600 .72rem var(--sans);font-style:normal;color:rgba(255,255,255,.28);padding:.5rem .6rem}
.thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thread path{fill:none;stroke:rgba(251,248,241,.45);stroke-width:1.6;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 3.2s var(--ease) .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-c{position:relative;z-index:5;margin:auto;text-align:center;padding:8rem 1.25rem 3rem;max-width:900px;pointer-events:none}
.hero-c>*{pointer-events:auto}
.who{display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.35rem .9rem .35rem .4rem;font-size:.85rem;font-weight:600}
.who img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.who i{width:8px;height:8px;border-radius:50%;background:#7FD6B4;box-shadow:0 0 0 0 rgba(127,214,180,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(127,214,180,0)}100%{box-shadow:0 0 0 0 rgba(127,214,180,0)}}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(3.2rem,8.6vw,7.6rem);line-height:.96;letter-spacing:-.025em;margin:1.4rem 0 1.2rem;color:#FFF7E3}
.hero h1 em{display:block;font-style:italic;font-weight:400}
.hero .lede{margin:0 auto;opacity:.85}
.hero .actions{margin-top:2rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.hero .hint{margin-top:1.4rem;font-family:var(--hand);font-size:1.35rem;opacity:.75}

/* floating desk items */
.fl{position:absolute;z-index:4;touch-action:none;cursor:grab;user-select:none;transform:rotate(var(--r,0deg));transition:filter .3s,scale .3s var(--ease);will-change:translate}
.fl.drag{cursor:grabbing;scale:1.06;filter:drop-shadow(0 26px 30px rgba(0,0,0,.35))}
.fl.pop{animation:pop .9s var(--ease) both;animation-delay:var(--dl,0s)}
@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.note{width:168px;min-height:150px;padding:1.4rem 1rem 1rem;font-family:var(--hand);font-weight:700;font-size:1.6rem;line-height:1.05;color:#2A2A22;box-shadow:0 22px 28px -16px rgba(0,0,0,.55),0 1px 0 rgba(0,0,0,.08)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(255,255,255,.55);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.note.pin::before{width:16px;height:16px;top:8px;margin-left:-8px;border-radius:50%;background:#D9443A;box-shadow:0 3px 4px rgba(0,0,0,.35)}
.n-butter{background:var(--butter)}.n-rose{background:var(--rose)}.n-sky{background:var(--sky)}.n-mint{background:var(--mint)}
.pola{background:#fff;padding:8px 8px 0;width:170px;box-shadow:0 24px 30px -16px rgba(0,0,0,.55);color:#2A2A22}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;pointer-events:none}
.pola span{display:block;font-family:var(--hand);font-weight:700;font-size:1.3rem;text-align:center;padding:.25rem 0 .45rem}
.stk svg{width:96px;height:96px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));pointer-events:none}
.fcur{position:absolute;left:0;top:0;z-index:6;pointer-events:none;will-change:transform}
.fcur svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.fcur b{position:absolute;left:18px;top:18px;background:var(--rose);color:var(--ink);font:700 .72rem var(--sans);padding:.25rem .55rem;border-radius:6px 999px 999px 999px;white-space:nowrap}
.ctx{position:fixed;z-index:80;min-width:200px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:.35rem;box-shadow:0 20px 40px -12px rgba(0,0,0,.4);display:none;color:var(--ink)}
.ctx.on{display:block;animation:ctx .18s ease-out}
@keyframes ctx{from{opacity:0;transform:scale(.96)}}
.ctx button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;font:500 .88rem var(--sans);padding:.5rem .7rem;border-radius:8px;cursor:pointer}
.ctx button:hover{background:var(--selection);color:#fff}
.ctx button kbd{font:500 .75rem var(--sans);opacity:.55}
.ctx hr{border:0;border-top:1px solid rgba(0,0,0,.08);margin:.3rem .4rem}
.brands{position:relative;z-index:5;border-top:1px solid rgba(255,255,255,.12);padding:1.1rem 0 1.4rem}
.brands p{text-align:center;font-size:.8rem;opacity:.6;margin-bottom:.6rem}
.mq{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:slide 38s linear infinite}
.track span{display:flex;align-items:center;gap:2.6rem;padding-right:2.6rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.6rem;white-space:nowrap}
.track span::after{content:"✦";font-style:normal;font-size:.8rem;color:var(--gold)}
@keyframes slide{to{transform:translateX(-50%)}}
.perf{height:16px;background:repeating-linear-gradient(90deg,var(--paper) 0 16px,transparent 16px 32px);margin-top:-1px}

/* ---------- sections ---------- */
section{position:relative}
.pad{padding:7rem 0}
.sh{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:end;margin-bottom:3rem}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--rd,0s)}
.rv.in{opacity:1;transform:none}

/* about */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:4rem;align-items:center}
.portrait{position:relative}
.portrait .ph{aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:var(--sage);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.portrait .ph img{width:100%;height:100%;object-fit:cover}
.portrait .note{position:absolute;right:-28px;top:-24px;width:150px;min-height:120px;font-size:1.4rem;--r:6deg;transform:rotate(6deg)}
.dock{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:.45rem;padding:.55rem .7rem;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);height:66px}
.dock .ti{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 .92rem var(--sans);flex:none;transition:width .18s ease-out,height .18s ease-out;cursor:default}
.dock .ti em{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:600 .72rem var(--sans);font-style:normal;padding:.25rem .55rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.dock .ti:hover em{opacity:1}
.c0{background:var(--ink);color:var(--gold)}.c1{background:var(--board);color:var(--mint)}.c2{background:var(--rose);color:var(--ink)}.c3{background:var(--sky);color:var(--ink)}.c4{background:var(--butter);color:var(--ink)}.c5{background:#2B2140;color:#E7C9FF}.c6{background:var(--mint);color:var(--board)}.c7{background:#5B2A2A;color:#FFD3C2}
.about-text .lede{margin-top:1.4rem}
.folders{display:flex;flex-wrap:wrap;gap:1.4rem 2rem;margin-top:2.2rem}
.folder{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-decoration:none;font-size:.8rem;font-weight:600;width:84px;text-align:center}
.folder svg{width:66px;height:54px;overflow:visible}
.folder .front{transform-origin:50% 100%;transition:transform .45s var(--ease)}
.folder:hover .front{transform:perspective(200px) rotateX(-28deg)}
.folder .paperS{transition:transform .45s var(--ease)}
.folder:hover .paperS{transform:translateY(-8px)}
.facts{margin-top:2.4rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;border-top:1px solid rgba(18,38,29,.15);padding-top:1.4rem}
.facts b{display:block;font-family:var(--serif);font-weight:800;font-size:2.8rem;line-height:1}
.facts span{font-size:.82rem;opacity:.65}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1.15fr .85fr;gap:1.2rem;margin-top:6rem}
.card{border-radius:26px;padding:1.6rem;position:relative;overflow:hidden;border:1px solid rgba(18,38,29,.08)}
.card h3{font-family:var(--serif);font-weight:800;font-size:1.7rem;line-height:1.05}
.card h3 em{font-weight:400}
.card p.s{font-size:.9rem;opacity:.75;margin-top:.4rem}
.insta{background:#fff}
.ig-top{display:flex;align-items:center;gap:1rem}
.ig-av{width:74px;height:74px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),var(--rose),var(--mint),var(--gold));flex:none}
.ig-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.ig-stats{display:flex;gap:1.1rem;font-size:.8rem;text-align:center;flex:1;justify-content:space-around}
.ig-stats b{display:block;font-size:1.05rem}
.ig-name{margin-top:.8rem;font-weight:700;font-size:.9rem}
.ig-bio{font-size:.84rem;opacity:.8}
.ig-act{display:flex;gap:.5rem;margin:.9rem 0}
.ig-act button{flex:1;border:0;border-radius:10px;padding:.55rem;font:700 .82rem var(--sans);cursor:pointer;background:#EFEFEF;color:var(--ink);transition:background .3s,color .3s}
.ig-act button.fol{background:var(--selection);color:#fff}
.ig-act button.fol.on{background:#EFEFEF;color:var(--ink)}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -1.6rem -1.6rem}
.ig-grid img{aspect-ratio:1;object-fit:cover;width:100%}
.skills{background:linear-gradient(0deg,#F2B36F,#F7C98F);min-height:360px}
.skills h3,.skills p{position:relative;z-index:2}
.pill{position:absolute;padding:.55rem 1.05rem;border-radius:999px;background:#fff;font:700 .85rem var(--sans);box-shadow:0 10px 20px -10px rgba(0,0,0,.4);white-space:nowrap}
.quote-card{background:var(--board);color:var(--ivory);display:flex;flex-direction:column;justify-content:space-between;gap:1.4rem}
.quote-card blockquote{font-family:var(--serif);font-style:italic;font-size:1.6rem;line-height:1.15}
.quote-card .sig{font-family:var(--hand);font-size:1.8rem;color:var(--gold)}

/* table of contents */
.toc{text-align:center}
.toc .mix{font-size:clamp(3rem,8vw,6.4rem)}
.toc-row{display:flex;justify-content:center;gap:2rem;margin-top:3.4rem;flex-wrap:wrap}
.toc-i{display:flex;flex-direction:column;align-items:center;gap:.8rem;text-decoration:none;width:210px}
.toc-i small{font-size:.78rem;font-weight:600;opacity:.55}
.toc-i .im{width:190px;aspect-ratio:1;border-radius:26px;overflow:hidden;background:#EEE8DC;padding:12px;transition:transform .6s var(--ease)}
.toc-i .im img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.toc-i:hover .im{transform:translateY(-10px) rotate(-3deg)}
.toc-i:nth-child(2):hover .im{transform:translateY(-10px) rotate(3deg)}

/* horizontal work gallery */
.hz{position:relative}
.hz-sticky{position:sticky;top:0;height:100vh;height:100svh;display:grid;grid-template-columns:minmax(300px,31vw) 1fr;align-items:center;overflow:hidden}
.hz-head{padding:5rem 3vw 0 5vw}
.hz-head .mix{font-size:clamp(2.6rem,4.6vw,4.4rem)}
.hz-head p{margin-top:1rem;opacity:.75;max-width:36ch;font-size:.95rem}
.filters{display:flex;gap:1rem;margin-top:1.6rem;overflow-x:auto;padding:.3rem .1rem .4rem;scrollbar-width:none}
.filters button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.4rem;font:600 .72rem var(--sans);flex:none;cursor:pointer}
.hl-ring{width:62px;height:62px;border-radius:50%;padding:3px;border:2px solid rgba(18,38,29,.2);transition:border-color .4s,transform .5s var(--ease)}
.hl-ring>*{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--board);color:var(--ivory);font-family:var(--serif);font-style:italic;font-weight:700;font-size:1.3rem}
.filters button:hover .hl-ring{transform:scale(1.06)}
.filters button[aria-pressed="true"] .hl-ring{border:2.5px solid transparent;background:conic-gradient(var(--gold),var(--rose),var(--mint),var(--gold)) border-box;-webkit-mask:none}
.filters button[aria-pressed="true"] .hl-ring>*{outline:3px solid var(--paper)}
.hz-prog{margin-top:1.6rem;display:flex;align-items:center;gap:1rem;font-family:var(--serif);font-style:italic;font-size:1.2rem}
.hz-prog .pb{flex:1;max-width:160px;height:2px;background:rgba(18,38,29,.15)}
.hz-prog .pb i{display:block;height:100%;width:0;background:var(--ink)}
.hz-view{height:100%;display:flex;align-items:center;overflow:hidden}
.hz-track{display:flex;gap:2.2vw;align-items:center;padding:4rem 6vw 0 1vw;will-change:transform}
.wk{flex:none;height:62vh;display:flex;flex-direction:column;gap:.8rem;cursor:pointer;background:none;border:0;text-align:left}
.wk .media{flex:1;border-radius:22px;overflow:hidden;position:relative;background:var(--board);box-shadow:0 24px 40px -26px rgba(0,0,0,.5);transition:transform .7s var(--ease),border-radius .7s var(--ease)}
.wk:hover .media{transform:rotate(-1.5deg) scale(.98);border-radius:34px}
.wk .media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.wk.f-square{width:calc(62vh - 3rem)}.wk.f-portrait{width:calc((62vh - 3rem)*.8)}.wk.f-story{width:calc((62vh - 3rem)*.5625)}.wk.f-wide{width:calc((62vh - 3rem)*1.6)}
.wk .cap{display:flex;justify-content:space-between;gap:1rem;align-items:center}
.wk .cap em{font-family:var(--serif);font-weight:700;font-style:normal;font-size:1.25rem}
.wk.hidden{display:none}
.wk .media .tagc{position:absolute;left:1rem;bottom:1rem;z-index:3}
/* post art */
.media{position:relative}
.scrim{position:absolute;inset:0;background:rgba(8,24,18,.32);z-index:1}
.pv{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.pv .tg{font-size:.7rem;font-weight:700}
.pv .hl{font-family:var(--serif);font-weight:700;line-height:1;font-size:clamp(1.7rem,3.2vh,2.8rem);text-shadow:0 2px 24px rgba(0,0,0,.3)}
.pv .pl{align-self:flex-start;padding:.35rem .8rem;border-radius:999px;border:1px solid currentColor;font-size:.68rem;font-weight:700}
.on-img{color:#fff}
.t-light{background:var(--ivory);color:var(--ink)}.t-sage{background:var(--sage);color:var(--ink)}.t-forest{background:var(--ink);color:var(--ivory)}.t-pine{background:var(--board);color:var(--ivory)}.t-gold{background:var(--gold);color:var(--ink)}
.slides{display:flex;position:absolute;inset:0}
.slides>div{flex:1;position:relative;border-right:1px solid rgba(255,255,255,.15);overflow:hidden}
.slides>div:last-child{border:0}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wk.f-wide .pv .hl{font-size:clamp(2.2rem,5.4vh,4rem)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:250;background:rgba(12,30,22,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:2rem;color:var(--ivory)}
#lb.open{display:flex;animation:lbin .5s var(--ease)}
@keyframes lbin{from{opacity:0}}
#lb .box{display:grid;grid-template-columns:auto 300px;gap:2.5rem;align-items:end;max-width:1100px;width:100%}
#lb .media{height:min(78vh,720px);border-radius:22px;overflow:hidden;animation:lbz .7s var(--ease)}
#lb .media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lb .media .pv .hl{font-size:clamp(2.2rem,4.6vw,3.8rem)}
@keyframes lbz{from{transform:scale(.92);opacity:0}}
#lb h3{font-family:var(--serif);font-weight:800;font-size:2.8rem;line-height:1}
#lb p{opacity:.75;margin-top:.6rem}
#lb .x,#lb .nx button{background:none;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;font:600 .85rem var(--sans)}
#lb .x{position:absolute;top:1.4rem;right:1.4rem}
#lb .nx{display:flex;gap:.5rem;margin-top:1.4rem}

/* videography phones */
.vids .sh{grid-template-columns:1fr 1fr}
.phones{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem}
.vp{display:flex;flex-direction:column;gap:.9rem}
.phone{aspect-ratio:9/19;border-radius:34px;background:#0B0F0D;padding:7px;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 40px 60px -30px rgba(0,0,0,.7);position:relative;cursor:pointer;transition:transform .6s var(--ease)}
.vp:nth-child(odd) .phone{transform:rotate(-2deg)}.vp:nth-child(even) .phone{transform:rotate(2deg) translateY(24px)}
.vp:hover .phone{transform:rotate(0) translateY(-8px)}
.phone .scr{position:absolute;inset:7px;border-radius:28px;overflow:hidden;background:#222}
.phone .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate;transform-origin:var(--o,50% 50%)}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.32) translate(-3%,-2%)}}
.phone.paused .scr img,.phone.paused .vbar i{animation-play-state:paused}
.phone .island{position:absolute;top:10px;left:50%;width:30%;height:16px;margin-left:-15%;background:#000;border-radius:20px;z-index:3}
.phone .vtop{position:absolute;top:34px;left:12px;right:12px;display:flex;align-items:center;gap:.4rem;color:#fff;font:700 .68rem var(--sans);z-index:2}
.phone .vtop i{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.phone .vbot{position:absolute;left:12px;right:12px;bottom:14px;color:#fff;z-index:2;font-size:.72rem}
.phone .vbot b{display:block;font-family:var(--serif);font-size:1.05rem}
.vbar{height:3px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:.5rem;overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:#fff;animation:vb 12s linear infinite}
@keyframes vb{to{width:100%}}
.phone .side{position:absolute;right:10px;bottom:70px;display:grid;gap:.7rem;z-index:2}
.phone .side svg{width:20px;height:20px;fill:#fff}
.phone .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 24%,transparent 62%,rgba(0,0,0,.55));z-index:1}
.phone .pz{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:3;opacity:0;transition:opacity .3s}
.phone .pz::after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.phone.paused .pz{opacity:1}
.vp h4{font-family:var(--serif);font-size:1.15rem}
.vp p{font-size:.84rem;opacity:.75}

/* AI lab */
.ai{background:var(--ink);color:var(--ivory)}
.lab{display:grid;grid-template-columns:1.05fr .95fr;gap:1.4rem;align-items:stretch}
.lab>*,.lab3>*{min-width:0}
.canvas-wrap{position:relative;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.12);aspect-ratio:1;background:var(--board)}
.canvas-wrap canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:1rem;right:1rem;bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.78rem;background:rgba(10,20,16,.7);backdrop-filter:blur(6px);padding:.6rem .9rem;border-radius:999px}
.hud .pb{flex:1;max-width:140px;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.hud .pb i{display:block;height:100%;width:0;background:var(--gold)}
.panel{border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:2rem;display:flex;flex-direction:column;gap:1.1rem;background:rgba(255,255,255,.03)}
.panel h3{font-family:var(--serif);font-weight:800;font-size:2.2rem;line-height:1.05}
.panel h3 em{font-weight:400}
.panel p{opacity:.78;max-width:46ch}
.prompt{display:flex;gap:.5rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.35rem .35rem .35rem 1.2rem}
.prompt:focus-within{border-color:var(--gold)}
.prompt input{flex:1;min-width:0;background:none;border:0;color:var(--ivory);font:500 1rem var(--sans);outline:none}
.prompt .btn{padding:.75rem 1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{background:none;border:1px solid rgba(255,255,255,.22);color:var(--ivory);border-radius:999px;padding:.45rem .9rem;font:500 .8rem var(--sans);cursor:pointer;transition:background .3s,border-color .3s}
.chips button:hover{border-color:var(--gold);background:rgba(198,171,110,.12)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;margin-top:auto}
.strip button{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid transparent;padding:0;cursor:pointer;background:var(--board);transition:transform .4s var(--ease),border-color .3s}
.strip button:hover{transform:translateY(-4px);border-color:var(--gold)}
.strip img,.strip svg{width:100%;height:100%;object-fit:cover;display:block}
.small-k{font-size:.8rem;opacity:.6}
.lab3{display:grid;grid-template-columns:.8fr 1.2fr;gap:1.4rem;margin-top:1.4rem}
.cmp{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;--p:50%;user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .before img{filter:grayscale(.85) brightness(.82) contrast(.85)}
.cmp .after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p))}
.cmp .after img{filter:saturate(1.15) contrast(1.05)}
.cmp .after .pv .hl{font-size:clamp(2rem,4vw,3.4rem)}
.cmp .lbl{position:absolute;top:1rem;z-index:3;font-size:.75rem;font-weight:700;padding:.35rem .8rem;border-radius:999px;background:rgba(10,20,16,.65);color:#fff}
.cmp .lbl.l{left:1rem}.cmp .lbl.r{right:1rem;background:var(--butter);color:var(--ink)}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;z-index:4;pointer-events:none}
.cmp .handle::after{content:"⟷";position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:5;margin:0}
.ai .tools{margin-top:2.6rem}
.ai .tools .track span{font-size:1.4rem;color:var(--ivory)}

/* case studies */
.cases{display:grid;gap:5rem}
.case{position:relative;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;background:var(--board);color:var(--ivory);border-radius:32px;padding:3.2rem 3.4rem;min-height:420px}
.case:nth-child(even){grid-template-columns:.75fr 1.25fr}
.case:nth-child(even) .ct{order:2}
.case .ct .mix{font-size:clamp(2.6rem,5vw,4.4rem)}
.case .brandn{font-family:var(--serif);font-style:italic;font-size:1.5rem;margin:.4rem 0 1rem;color:var(--gold)}
.case p{opacity:.82;max-width:52ch}
.case ul{list-style:none;margin-top:1.4rem;display:grid;gap:.4rem}
.case li{font-weight:700}
.case li::before{content:"+ ";color:var(--gold)}
.case .phone{width:min(250px,100%);margin:-6rem auto;transform:rotate(7deg)}
.case:nth-child(even) .phone{transform:rotate(-7deg)}
.case .phone .scr img{animation-duration:16s}

/* services */
.svc{list-style:none;border-top:1.5px solid var(--ink)}
.svc li{position:relative;display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:2rem;padding:1.7rem 1rem;border-bottom:1.5px solid var(--ink);align-items:center;isolation:isolate;transition:color .45s var(--ease)}
.svc li::before{content:"";position:absolute;inset:0;background:var(--board);z-index:-1;transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease)}
.svc li:hover{color:var(--ivory)}
.svc li:hover::before{transform:none}
.svc h3{font-family:var(--serif);font-weight:800;font-size:clamp(1.7rem,3vw,2.5rem);line-height:1}
.svc li:nth-child(even) h3{font-style:italic;font-weight:500}
.svc p{max-width:52ch;opacity:.8}
.svc .price{font-weight:800}
.svc .price .mark{font-size:.85rem}

/* contact */
.contact{padding:7rem 0 8rem;overflow:hidden}
.contact .cal{grid-auto-rows:140px}
.paperC{position:relative;z-index:3;background:var(--ivory);color:var(--ink);border-radius:26px;padding:4rem 3.4rem;max-width:980px;margin:0 auto;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.paperC::after{content:"";position:absolute;right:0;bottom:0;width:96px;height:96px;border-radius:26px 0 26px 0;background:linear-gradient(135deg,#EFE6D2 0%,#FFFFFF 40%,#D9D0BD 50%,var(--board) 50.5%);box-shadow:-8px -8px 18px -6px rgba(0,0,0,.25);transition:width .6s var(--ease),height .6s var(--ease)}
.paperC:hover::after{width:150px;height:150px}
.cont-h{text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(3rem,8vw,6.6rem);line-height:1.06;letter-spacing:-.02em}
.cont-h .sel:nth-child(2){font-style:italic;font-weight:500}
.cont-h .sel{margin:.08em 0}
.paperC .lede{margin:1.4rem auto 0;text-align:center}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:2.6rem}
.cform label{display:grid;gap:.35rem;font-size:.8rem;font-weight:700}
.cform .full{grid-column:1/-1}
.cform input,.cform textarea,.cform select{font:500 1rem var(--sans);padding:.9rem 1rem;border-radius:14px;border:1.5px solid rgba(18,38,29,.15);background:#fff;color:var(--ink);transition:border-color .3s}
.cform input:focus,.cform textarea:focus,.cform select:focus{border-color:var(--selection);outline:none}
.crow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;grid-column:1/-1;margin-top:.4rem}
.note-s{font-size:.9rem;min-height:1.4em;color:var(--board);font-weight:600;grid-column:1/-1}
.lss{display:inline-flex;background:#fff;border:1px solid rgba(18,38,29,.12);border-radius:999px;padding:.25rem;box-shadow:0 6px 16px -10px rgba(0,0,0,.3)}
.lss button{border:0;background:none;padding:.5rem .9rem;border-radius:999px;font:700 .8rem var(--sans);cursor:pointer;display:flex;align-items:center;gap:.35rem;transition:background .3s}
.lss button:hover{background:#F1EEE6}
.lss button.on{color:#D9443A}
.lss svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.lss button.on svg{fill:currentColor}
.cinfo{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem 2rem;margin-top:2.4rem;font-size:.88rem;font-weight:600}
.cinfo a{text-decoration:none}
.cinfo a:hover{color:var(--selection)}
.contact .fl{z-index:4}
footer{background:var(--ink);color:var(--ivory);padding:3rem 0 2rem}
footer .big{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,11vw,10rem);line-height:.95;text-align:center;letter-spacing:-.03em}
footer .big em{font-weight:400}
footer .row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;opacity:.6;font-size:.82rem;margin-top:2rem}
footer a{text-decoration:none}
#btt{position:fixed;right:1.3rem;bottom:1.3rem;z-index:58;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--butter);cursor:pointer;display:grid;place-items:center;opacity:0;transform:translateY(20px) scale(.8);transition:opacity .4s,transform .5s var(--ease);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#btt.on{opacity:1;transform:none}
#btt svg{position:absolute;inset:0;transform:rotate(-90deg)}
#btt circle{fill:none;stroke-width:2}
#btt .bg{stroke:rgba(249,226,125,.2)}#btt .fg{stroke:var(--butter);stroke-dasharray:151;stroke-dashoffset:151}
#site img{opacity:0;transition:opacity .9s var(--ease)}
#site img.ld{opacity:1}

/* ================= ADMIN ================= */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:200;background:#F7F8F4;color:var(--ink);box-shadow:-30px 0 60px -20px rgba(0,0,0,.35);display:none;flex-direction:column;font-size:.9rem;transform:translateX(100%);transition:transform .5s var(--ease)}
#admin.open{display:flex}
#admin.shown{transform:none}
.ad-top{padding:1rem 1.2rem;border-bottom:1px solid #DDE3D8;display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--ink);color:var(--ivory)}
.ad-top b{font-family:var(--serif);font-size:1.6rem;font-weight:700;font-style:normal;font-optical-sizing:auto}
.ad-top .x{background:none;border:1px solid rgba(242,240,230,.4);color:inherit;border-radius:999px;padding:.4rem .9rem;cursor:pointer;font:500 .8rem var(--sans)}
.ad-tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.8rem 1.2rem;border-bottom:1px solid #DDE3D8;scrollbar-width:none}
.ad-tabs button{flex:none;font:500 .8rem var(--sans);padding:.45rem .9rem;border-radius:999px;border:1px solid #CBD4C6;background:#fff;cursor:pointer;color:var(--ink)}
.ad-tabs button[aria-selected="true"]{background:var(--pine);color:var(--ivory);border-color:var(--pine)}
.ad-body{flex:1;overflow-y:auto;padding:1.2rem}
.ad-body h4{font-family:var(--serif);font-size:1.5rem;margin:0 0 .8rem;font-weight:700;font-style:normal;font-optical-sizing:auto}
.fld{display:grid;gap:.3rem;margin-bottom:.9rem}
.fld>span{font-size:.75rem;font-weight:600;opacity:.75}
.fld input[type=text],.fld textarea,.fld select{font:400 .9rem var(--sans);padding:.6rem .75rem;border:1px solid #CBD4C6;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld input[type=color]{width:56px;height:34px;border:1px solid #CBD4C6;border-radius:8px;background:#fff;padding:2px}
.fld.chk{display:flex;align-items:center;gap:.6rem}
.grp{border:1px solid #DDE3D8;border-radius:12px;padding:.9rem;margin-bottom:.9rem;background:#fff}
.grp>.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:.4rem}
.grp>.gh b{font-size:.82rem}
.mini{font:500 .72rem var(--sans);padding:.3rem .6rem;border:1px solid #CBD4C6;border-radius:6px;background:#fff;cursor:pointer;color:var(--ink)}
.mini.del{color:#9B2C2C;border-color:#E6C4C4}
.add{width:100%;font:600 .8rem var(--sans);padding:.65rem;border:1px dashed var(--pine);border-radius:10px;background:transparent;color:var(--pine);cursor:pointer;margin-bottom:1rem}
.imgf{display:flex;gap:.6rem;align-items:center}
.imgf .thumbp{width:58px;height:58px;border-radius:8px;background:#E6EBE2 center/cover no-repeat;border:1px solid #CBD4C6;flex:none}
.imgf label.up{font:500 .78rem var(--sans);padding:.45rem .8rem;border:1px solid #CBD4C6;border-radius:8px;cursor:pointer;background:#fff}
.imgf input[type=file]{display:none}
.ad-foot{border-top:1px solid #DDE3D8;padding:.9rem 1.2rem;display:grid;gap:.6rem;background:#fff}
.ad-foot .r{display:flex;gap:.5rem;flex-wrap:wrap}
.ad-foot button{font:600 .8rem var(--sans);padding:.65rem 1rem;border-radius:999px;border:1px solid var(--pine);background:#fff;color:var(--pine);cursor:pointer}
.ad-foot button.pri{background:var(--pine);color:var(--ivory)}
.ad-status{font-size:.78rem;min-height:1.2em;color:var(--pine)}
.help{font-size:.8rem;opacity:.75;margin-bottom:1rem;line-height:1.5}
.ad-gate{padding:2rem 1.4rem;display:grid;gap:1rem}
textarea.json{font-family:ui-monospace,monospace;font-size:.75rem;min-height:220px}




/* photo posts */
.scrim{position:absolute;inset:0;background:rgba(8,24,18,.34);z-index:1}
.pv.on-img{color:#fff;z-index:2}
.pv.on-img .hl{text-shadow:0 2px 24px rgba(0,0,0,.35)}
.tile .pv.on-img b{color:#fff}
.slides .media{position:relative;overflow:hidden}
.fp .pv .hl{font-size:1.45rem}
.fp .pv{padding:8%}
.wk .media img{transform:scale(1.12);transition:none;will-change:transform}
.wk:hover .media img{transform:scale(1.12)}
.player>img{transition:transform 8s ease-out}
.player.playing>img{transform:scale(1.18)}
.wk .media{clip-path:inset(0 0 0 0 round 20px)}

function grain(c,W,seed){const r=rng(seed);c.globalAlpha=.06;for(let i=0;i<9000;i++){c.fillStyle=r()>.5?"#fff":"#000";c.fillRect(r()*W,r()*W,1.5,1.5)}c.globalAlpha=1}
function compose(c,W,prompt,t){
  const p=prompt.toLowerCase(),r=rng(hash(p)),pick=a=>a[Math.floor(r()*a.length)];
  const night=/night|moon|dark|star|evening/.test(p),gold=/sun|gold|summer|warm|desert/.test(p),nature=/forest|green|nature|tea|garden|hill|mountain|field|leaf/.test(p);
  const product=/bottle|perfume|product|skincare|cream|shoe|sneaker|watch|cup|coffee|phone|bag|serum/.test(p),person=/portrait|person|model|woman|man|girl|boy|face|arch/.test(p);
  const bg=night?t.ink:gold?t.sage:pick([t.sage,t.board,t.ivory,t.ink]);
  c.fillStyle=bg;c.fillRect(0,0,W,W);
  const dark=bg===t.ink||bg===t.board;
  if(night){for(let i=0;i<70;i++){c.fillStyle=t.ivory;c.globalAlpha=.3+r()*.7;c.beginPath();c.arc(r()*W,r()*W*.6,r()*1.8+.4,0,7);c.fill()}c.globalAlpha=1}
  // orb
  c.fillStyle=night?t.ivory:t.gold;c.beginPath();c.arc(W*(.25+r()*.5),W*(.2+r()*.2),W*(.09+r()*.08),0,7);c.fill();
  // hills
  const layers=nature||gold||!product&&!person?3:1;const hcols=[dark?"#2D5A46":t.board,t.ink,dark?t.sage:"#2D5A46"];
  for(let l=0;l<layers;l++){c.fillStyle=hcols[l%3];c.beginPath();const base=W*(.58+l*.12),amp=W*(.05+r()*.06),f=1.5+r()*2,ph=r()*6;c.moveTo(0,W);
    for(let x=0;x<=W;x+=8)c.lineTo(x,base+Math.sin(x/W*f*Math.PI+ph)*amp);c.lineTo(W,W);c.fill()}
  if(nature){for(let i=0;i<14;i++){const x=r()*W,y=W*(.66+r()*.25),h=W*(.05+r()*.07);c.fillStyle=pick([t.ink,t.board]);c.beginPath();c.moveTo(x,y-h);c.lineTo(x-h*.35,y);c.lineTo(x+h*.35,y);c.fill()}}
  if(product){// pedestal + bottle
    c.fillStyle=t.ivory;c.globalAlpha=.9;c.beginPath();c.ellipse(W/2,W*.82,W*.26,W*.05,0,0,7);c.fill();c.globalAlpha=1;
    c.fillStyle=t.ink;c.globalAlpha=.25;c.beginPath();c.ellipse(W/2,W*.8,W*.15,W*.025,0,0,7);c.fill();c.globalAlpha=1;
    const bw=W*.2,bh=W*.34,bx=W/2-bw/2,by=W*.8-bh;c.fillStyle=pick([t.gold,t.ivory,t.sage]);rr(c,bx,by,bw,bh,bw*.18);c.fill();
    c.fillStyle=t.ink;rr(c,W/2-bw*.22,by-W*.07,bw*.44,W*.075,6);c.fill();
    c.fillStyle="rgba(255,255,255,.35)";rr(c,bx+bw*.14,by+bh*.1,bw*.1,bh*.7,8);c.fill();
    c.fillStyle=t.ink;c.font=`700 ${W*.045}px "Playfair Display", Georgia, serif`;c.textAlign="center";c.fillText((prompt.split(" ")[0]||"").slice(0,10),W/2,by+bh*.55)}
  if(person){c.fillStyle=t.ivory;c.globalAlpha=.9;rr(c,W*.3,W*.18,W*.4,W*.82,W*.2);c.fill();c.globalAlpha=1;
    c.fillStyle=t.ink;c.beginPath();c.arc(W/2,W*.45,W*.09,0,7);c.fill();c.beginPath();c.ellipse(W/2,W*.82,W*.17,W*.2,0,Math.PI,0);c.fill();c.fillRect(W*.33,W*.82,W*.34,W*.2)}
  grain(c,W,hash(p)+3);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- live sync (Claude artifact db) ---------- */
const LIVE={db:null,ref:null,assets:null,owner:false,ready:false,last:"",writing:false,queued:false};
function stripData(o){return JSON.parse(JSON.stringify(o,(k,v)=>typeof v==="string"&&v.startsWith("data:")?"":v))}
async function liveInit(){
  if(!window.claude?.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db)return;
    LIVE.db=db;LIVE.owner=!!(await user?.isOwner?.());
    if(LIVE.owner)LIVE.assets=await claude.use("assets");
    LIVE.ref=db.doc("site/content");
    LIVE.ref.onSnapshot(snap=>{
      LIVE.ready=true;
      if(!snap.exists)return;
      const json=JSON.stringify(snap.data().content||{});
      if(json===LIVE.last)return;LIVE.last=json;
      if(snap.metadata.hasPendingWrites)return;
      try{const next=merge(DEFAULT,JSON.parse(json));if(JSON.stringify(next)===JSON.stringify(C))return;C=next;const y=scrollY;render();scrollTo(0,y);if($("#admin").classList.contains("open"))drawTab()}catch{}
    },()=>{});
    updateLiveBadge();
  }catch{}
}
function updateLiveBadge(){const s=$("#adStatus");if(!s)return;s.textContent=LIVE.owner?"Live: changes save for everyone who opens this link.":"Changes save as a draft in this browser."}
async function liveSave(){
  if(!LIVE.ref||!LIVE.owner)return false;
  if(LIVE.writing){LIVE.queued=true;return true}
  LIVE.writing=true;
  try{const clean=stripData(C);const json=JSON.stringify(clean);
    if(json!==LIVE.last){LIVE.last=json;await LIVE.ref.set({content:clean,updatedAt:new Date().toISOString()})}
    status("Saved live. Everyone with the link sees this now.")}
  catch(e){status(e?.code==="quota_exceeded"?"Live storage is full. Remove some images.":"Couldn't save live right now. Your draft is kept in this browser.")}
  LIVE.writing=false;if(LIVE.queued){LIVE.queued=false;liveSave()}
  return true;
}

    const isImgList=k==="gallery"||k==="images";
    val.forEach((item,i)=>{
      const g=document.createElement("div");g.className="grp";
      const label=typeof item==="object"?(item.client||item.name||item.title||item.label||item.handle||item.value||`Item ${i+1}`):`${human(k).replace(/s$/,"")} ${i+1}`;
      g.innerHTML=`<div class="gh"><b>${esc(label)}</b><span style="display:flex;gap:.3rem"><button class="mini" data-a="up">↑</button><button class="mini" data-a="down">↓</button><button class="mini del" data-a="del">Remove</button></span></div>`;
      g.querySelector('[data-a=up]').onclick=()=>{if(i>0){[val[i-1],val[i]]=[val[i],val[i-1]];changed();drawTab()}};
      g.querySelector('[data-a=down]').onclick=()=>{if(i<val.length-1){[val[i+1],val[i]]=[val[i],val[i+1]];changed();drawTab()}};

    });

  }

      else if(v&&typeof v==="object"){const g=document.createElement("div");g.className="grp";g.innerHTML=`<div class="gh"><b>${human(kk)}</b></div>`;g.appendChild(field(p,v,kk));wrap.appendChild(g)}
      else if(typeof v==="boolean"){const l=document.createElement("label");l.className="fld chk";l.innerHTML=`<input type="checkbox" ${v?"checked":""}><span>${human(kk).replace(/^Show /,"Show ")}</span>`;l.firstChild.onchange=e=>setAt(p,e.target.checked);wrap.appendChild(l)}
      else if(path[0]==="theme"){const l=document.createElement("label");l.className="fld";l.innerHTML=`<span>${human(kk)}</span><span style="display:flex;gap:.5rem;align-items:center"><input type="color" value="${esc(v)}"><input type="text" value="${esc(v)}" style="max-width:120px"></span>`;

function compress(file,max=1600){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86))};im.src=r.result};r.readAsDataURL(file)})}

  <label class="fld"><span>Branch</span><input type="text" id="gB" value="${esc(g.branch||"main")}"></label>
  <label class="fld"><span>Access token</span><input type="text" id="gT" value="${esc(g.token||"")}" autocomplete="off" style="-webkit-text-security:disc"></label>
  <div class="r" style="display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1.4rem"><button class="mini" id="gGo" style="background:var(--pine);color:var(--ivory);padding:.6rem 1rem">Publish now</button><button class="mini" id="gForget" style="padding:.6rem 1rem">Forget token</button></div>
  <h4>Backup</h4>
  <p class="help">Copy all content as JSON to keep a backup, or paste JSON here and import it.</p>
  <label class="fld"><textarea class="json" id="gJ"></textarea></label>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="mini" id="gCopy" style="padding:.6rem 1rem">Copy content JSON</button><button class="mini" id="gImp" style="padding:.6rem 1rem">Import pasted JSON</button></div>`;
  const save=()=>LS.set(GH_KEY,JSON.stringify({owner:$("#gO").value.trim(),repo:$("#gR").value.trim(),branch:$("#gB").value.trim(),token:$("#gT").value.trim()}));
  ["gO","gR","gB","gT"].forEach(id=>$("#"+id).oninput=save);
  $("#gForget").onclick=()=>{$("#gT").value="";save();status("Token removed from this browser.")};
  $("#gGo").onclick=()=>{save();publish()};
  $("#gCopy").onclick=async()=>{const j=JSON.stringify(C,null,2);$("#gJ").value=j;try{await navigator.clipboard.writeText(j);status("Content JSON copied.")}catch{status("Select the text above and copy it.")}};
  $("#gImp").onclick=()=>{try{C=merge(DEFAULT,JSON.parse($("#gJ").value));changed();status("Imported.");}catch{status("That isn't valid JSON. Check what you pasted.")}};
}
const b64=s=>{const bytes=new TextEncoder().encode(s);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)};
async function publish(){
  const g=JSON.parse(LS.get(GH_KEY)||"{}");
  if(!g.owner||!g.repo||!g.token){status("Add your username, repository and token first.");return}
  const api=(path,opt={})=>fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`,{...opt,headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
  try{
    // 1. upload embedded images
    const data=clone(C);let n=0;const jobs=[];
    (function walk(o){for(const k in o){const v=o[k];if(typeof v==="string"&&v.startsWith("data:image/"))jobs.push([o,k,v]);else if(v&&typeof v==="object")walk(v)}})(data);
    for(const [o,k,v] of jobs){n++;status(`Uploading image ${n} of ${jobs.length}…`);
      const path=`assets/uploads/${Date.now()}-${n}.jpg`;
      const r=await api(path,{method:"PUT",body:JSON.stringify({message:`Upload ${path}`,content:v.split(",")[1],branch:g.branch||"main"})});
      if(!r.ok)throw new Error(`Image upload failed (${r.status})`);o[k]=path}
    // 2. write content.json
    status("Saving content…");
    let sha;const cur=await api(`content.json?ref=${encodeURIComponent(g.branch||"main")}`);if(cur.ok)sha=(await cur.json()).sha;
    const r=await api("content.json",{method:"PUT",body:JSON.stringify({message:"Update site content from admin",content:b64(JSON.stringify(data,null,2)),branch:g.branch||"main",sha})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error((e.message||"Save failed")+` (${r.status})`)}
    C=data;LS.set(DRAFT_KEY,JSON.stringify(C));
    status("Published. The live site updates in about a minute.");
  }catch(e){status(e.message==="Failed to fetch"?"Can't reach GitHub from here. Open the admin on your live site to publish.":"Publish stopped: "+e.message+". Check the token's repo access and permissions.")}
}

function openAdmin(){const a=$("#admin");if(a.classList.contains("open"))return;a.classList.add("open");adminShell();updateLiveBadge();requestAnimationFrame(()=>requestAnimationFrame(()=>a.classList.add("shown")))}
function closeAdmin(){const a=$("#admin");a.classList.remove("shown");a.style.transform="";setTimeout(()=>{a.classList.remove("open");a.innerHTML=""},450)}
function route(){location.hash==="#admin"?openAdmin():null}
addEventListener("hashchange",route);





/* ---------- boot ---------- */
(async()=>{
  if(location.protocol.startsWith("http")){try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok)C=merge(DEFAULT,await r.json())}catch{}}
  const d=LS.get(DRAFT_KEY);if(d){try{C=merge(DEFAULT,JSON.parse(d))}catch{}}
  render();firstRender=false;route();requestAnimationFrame(loop);liveInit();
  if(window.Lenis&&!RM){lenis=new Lenis({lerp:.09,smoothWheel:true});const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf)}
  document.fonts?.ready.then(measure);addEventListener("load",measure);
})();
</script>
</body>
</html>
